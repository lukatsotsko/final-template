<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Explorer - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body">
    <header class="header">
        <nav class="nav">
            <div class="nav__logo">Weather Explorer</div>
        </nav>
    </header>

    <main class="main">
        <section class="login section">
            <div class="login-header">
                <div class="login-icon">🌤</div>
                <h1 class="login-title">Weather Explorer</h1>
                <p class="login-subtitle">Enter your name to get started</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="login-form__group">
                    <label for="name-input" class="login-form__label">Your Name</label>
                    <input type="text" id="name-input" class="login-form__input" placeholder="e.g. Alex" required>
                </div>
                <p id="login-error" class="login-form__error" hidden></p>
                <button type="submit" class="login-form__button">Get Started</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2026 Weather Explorer Project. All rights reserved.</p>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
