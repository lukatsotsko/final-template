<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Explorer - Saved Cities</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body">
    <header class="header">
        <nav class="nav">
            <div class="nav__logo">Weather Explorer</div>
            <ul class="nav__list">
                <li class="nav__item"><a href="index.html" class="nav__link" data-i18n="nav.dashboard">Dashboard</a></li>
                <li class="nav__item"><a href="saved.html" class="nav__link nav__link--active" data-i18n="nav.saved">Saved Cities</a></li>
                <li class="nav__item"><a href="about.html" class="nav__link" data-i18n="nav.about">About</a></li>
            </ul>
            <div class="nav__user-area">
                <span id="nav-user" class="nav__user-name"></span>
                <button id="lang-toggle-btn" class="nav__lang-btn" title="Switch to Georgian">🇬🇪 ქარ</button>
                <button id="logout-btn" class="nav__logout-btn" data-i18n="nav.logout">Logout</button>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="saved section">
            <h1 class="section__title" data-i18n="saved.title">Your Favorite Cities</h1>
            <div id="saved-grid" class="saved-grid"></div>
            <p id="saved-empty" hidden data-i18n="saved.empty">You haven't saved any cities yet.</p>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text" data-i18n="footer.text">&copy; 2026 Weather Explorer Project. All rights reserved.</p>
    </footer>

    <script type="module" src="js/saved.js"></script>
</body>
</html>
