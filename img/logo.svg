<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 36" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="sunGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sun glow halo -->
  <circle cx="16" cy="18" r="11" fill="#fde68a" opacity="0.25"/>

  <!-- Sun rays -->
  <g stroke="#fcd34d" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="16" y1="3"  x2="16" y2="6"/>
    <line x1="16" y1="30" x2="16" y2="33"/>
    <line x1="1"  y1="18" x2="4"  y2="18"/>
    <line x1="28" y1="18" x2="31" y2="18"/>
    <line x1="5"  y1="7"  x2="7"  y2="9"/>
    <line x1="25" y1="7"  x2="23" y2="9"/>
    <line x1="5"  y1="29" x2="7"  y2="27"/>
  </g>

  <!-- Sun body -->
  <circle cx="16" cy="18" r="7" fill="#fbbf24" filter="url(#sunGlow)"/>

  <!-- Cloud -->
  <path d="
    M19 32
    C14 32 10 28.4 10 24
    C10 20.6 12.2 17.7 15.3 16.8
    C15.8 13.4 18.7 10.8 22.2 10.8
    C25.3 10.8 27.9 12.7 29 15.4
    C29.6 15.1 30.3 15 31 15
    C34.3 15 37 17.7 37 21
    C39.2 21.6 41 23.6 41 26
    C41 29.3 38.3 32 35 32
    Z
  " fill="url(#cloudGrad)"/>
</svg>
